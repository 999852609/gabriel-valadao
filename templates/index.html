<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Trip</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, #1e40af, #7c3aed);
      padding: 24px 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
    }

    .header p {
      color: rgba(255,255,255,0.8);
      margin-top: 4px;
      font-size: 14px;
    }

    .controls {
      padding: 16px 20px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
    }

    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(37,99,235,0.4); }
    .btn-primary:active { transform: translateY(0); }

    .btn-secondary {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }

    .btn-secondary:hover { background: #334155; color: #e2e8f0; }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .status {
      text-align: center;
      padding: 12px 20px;
      font-size: 14px;
      color: #94a3b8;
    }

    .status.loading { color: #60a5fa; }
    .status.error { color: #f87171; }
    .status.success { color: #4ade80; }

    .stats {
      display: flex;
      gap: 12px;
      padding: 0 20px 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .stat-card {
      background: #1e293b;
      border-radius: 10px;
      padding: 12px 20px;
      text-align: center;
      min-width: 100px;
      border: 1px solid #334155;
    }

    .stat-card .number {
      font-size: 24px;
      font-weight: 700;
      color: #60a5fa;
    }

    .stat-card .label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .deals {
      padding: 0 20px 24px;
      max-width: 800px;
      margin: 0 auto;
    }

    .deal-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 12px;
      border: 1px solid #334155;
      transition: border-color 0.2s;
    }

    .deal-card:hover { border-color: #475569; }

    .deal-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .deal-route {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .deal-route .arrow { color: #60a5fa; margin: 0 6px; }

    .deal-price {
      font-size: 26px;
      font-weight: 800;
      color: #4ade80;
      white-space: nowrap;
    }

    .deal-details {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    .deal-details span::before {
      display: inline-block;
      margin-right: 4px;
    }

    .deal-reason {
      font-size: 12px;
      color: #7c3aed;
      background: rgba(124,58,237,0.1);
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 12px;
    }

    .deal-actions { margin-top: 8px; }

    .btn-book {
      display: inline-block;
      padding: 8px 20px;
      background: linear-gradient(135deg, #059669, #10b981);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-book:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(5,150,105,0.3); }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }

    .empty .icon { font-size: 48px; margin-bottom: 12px; }
    .empty p { font-size: 16px; }

    .history-section {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px 24px;
    }

    .history-section h2 {
      font-size: 18px;
      color: #94a3b8;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .history-table th {
      text-align: left;
      padding: 8px 12px;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    .history-table td {
      padding: 8px 12px;
      color: #94a3b8;
      border-top: 1px solid #1e293b;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(96,165,250,0.3);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .header h1 { font-size: 22px; }
      .deal-top { flex-direction: column; }
      .deal-price { font-size: 22px; }
      .stats { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Jarvis Trip</h1>
    <p>Alerta de voos baratos saindo de GYN</p>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="searchBtn" onclick="searchFlights()">Buscar voos baratos</button>
    <button class="btn btn-secondary" id="historyBtn" onclick="loadHistory()">Historico</button>
  </div>

  <div class="status" id="status"></div>

  <div class="stats" id="stats" style="display:none;">
    <div class="stat-card">
      <div class="number" id="statTotal">0</div>
      <div class="label">Voos encontrados</div>
    </div>
    <div class="stat-card">
      <div class="number" id="statAlerts">0</div>
      <div class="label">Oportunidades</div>
    </div>
    <div class="stat-card">
      <div class="number" id="statCheapest">-</div>
      <div class="label">Mais barato</div>
    </div>
  </div>

  <div class="deals" id="deals"></div>

  <div class="history-section" id="historySection" style="display:none;">
    <h2>Historico de alertas</h2>
    <table class="history-table" id="historyTable">
      <thead>
        <tr><th>Data</th><th>Destino</th><th>Preco</th><th>Ida</th><th>Volta</th></tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>

  <script>
    async function searchFlights() {
      const btn = document.getElementById('searchBtn');
      const status = document.getElementById('status');
      const dealsEl = document.getElementById('deals');
      const statsEl = document.getElementById('stats');

      btn.disabled = true;
      status.className = 'status loading';
      status.innerHTML = '<span class="spinner"></span> Buscando voos... isso pode levar alguns segundos';
      dealsEl.innerHTML = '';
      statsEl.style.display = 'none';
      document.getElementById('historySection').style.display = 'none';

      try {
        const resp = await fetch('/api/search');
        const data = await resp.json();

        if (data.error) {
          status.className = 'status error';
          status.textContent = 'Erro: ' + data.error;
          btn.disabled = false;
          return;
        }

        status.className = 'status success';
        status.textContent = 'Busca concluida em ' + data.search_date;

        document.getElementById('statTotal').textContent = data.total_found;
        document.getElementById('statAlerts').textContent = data.total_alerts;

        const deals = data.deals;
        if (deals.length > 0) {
          const cheapest = Math.min(...deals.map(d => d.price));
          document.getElementById('statCheapest').textContent = 'R$' + cheapest;
        }
        statsEl.style.display = 'flex';

        if (deals.length === 0) {
          dealsEl.innerHTML = '<div class="empty"><div class="icon">&#9992;</div><p>Nenhuma oportunidade abaixo do teto de R$' + data.max_price + ' hoje</p></div>';
        } else {
          dealsEl.innerHTML = deals.map(d => dealCard(d)).join('');
        }
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Erro de conexao: ' + e.message;
      }

      btn.disabled = false;
    }

    function dealCard(d) {
      const bookBtn = d.booking_link
        ? '<a href="' + d.booking_link + '" target="_blank" rel="noopener" class="btn-book">Ver e reservar</a>'
        : '';

      return '<div class="deal-card">' +
        '<div class="deal-top">' +
          '<div class="deal-route">' + d.origin + '<span class="arrow">&rarr;</span>' + (d.city_to || d.destination) + '</div>' +
          '<div class="deal-price">R$ ' + d.price + '</div>' +
        '</div>' +
        '<div class="deal-details">' +
          '<span>Ida: ' + d.departure_date + '</span>' +
          (d.return_date ? '<span>Volta: ' + d.return_date + '</span>' : '') +
          (d.duration ? '<span>Duracao: ' + d.duration + '</span>' : '') +
          (d.stops ? '<span>' + d.stops + '</span>' : '') +
        '</div>' +
        (d.reason ? '<div class="deal-reason">' + d.reason + '</div>' : '') +
        '<div class="deal-actions">' + bookBtn + '</div>' +
      '</div>';
    }

    async function loadHistory() {
      const section = document.getElementById('historySection');
      const body = document.getElementById('historyBody');
      document.getElementById('deals').innerHTML = '';
      document.getElementById('stats').style.display = 'none';
      document.getElementById('status').textContent = '';

      try {
        const resp = await fetch('/api/history');
        const data = await resp.json();
        const rows = data.history.reverse();

        if (rows.length === 0) {
          body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#64748b;padding:24px;">Nenhum historico ainda</td></tr>';
        } else {
          body.innerHTML = rows.map(r =>
            '<tr>' +
              '<td>' + (r.search_date || '-') + '</td>' +
              '<td>' + (r.city || r.destination) + '</td>' +
              '<td style="color:#4ade80;font-weight:600;">R$ ' + r.price + '</td>' +
              '<td>' + (r.departure_date || '-') + '</td>' +
              '<td>' + (r.return_date || '-') + '</td>' +
            '</tr>'
          ).join('');
        }

        section.style.display = 'block';
      } catch (e) {
        document.getElementById('status').className = 'status error';
        document.getElementById('status').textContent = 'Erro ao carregar historico';
      }
    }
  </script>
</body>
</html>
