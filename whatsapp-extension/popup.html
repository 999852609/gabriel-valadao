<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
    }

    .header {
      background: #2563eb;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }

    .header h1 { font-size: 1rem; }
    .header p { font-size: 0.75rem; opacity: 0.85; margin-top: 0.25rem; }

    .content { padding: 1rem; }

    .status {
      background: #fff;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      text-align: center;
      color: #555;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .status .count {
      font-size: 1.5rem;
      font-weight: 700;
      color: #2563eb;
      display: block;
      margin-bottom: 0.15rem;
    }

    .btn {
      width: 100%;
      padding: 0.7rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 0.5rem;
      transition: background 0.2s;
    }

    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }

    .btn-secondary { background: #fff; color: #2563eb; border: 1.5px solid #2563eb; }
    .btn-secondary:hover { background: #eff6ff; }
    .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg {
      padding: 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-top: 0.5rem;
      display: none;
    }

    .msg.visible { display: block; }
    .msg.success { background: #dcfce7; color: #16a34a; }
    .msg.error { background: #fef2f2; color: #dc2626; }
    .msg.info { background: #eff6ff; color: #2563eb; }

    .preview {
      display: none;
      background: #fff;
      border-radius: 8px;
      margin-top: 0.75rem;
      max-height: 250px;
      overflow-y: auto;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .preview.visible { display: block; }

    .preview-item {
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid #eee;
      font-size: 0.8rem;
    }

    .preview-item:last-child { border-bottom: none; }
    .preview-item .name { font-weight: 600; }

    .preview-item .detail {
      color: #555;
      font-size: 0.7rem;
      margin-top: 0.15rem;
    }

    .footer {
      text-align: center;
      padding: 0.5rem;
      font-size: 0.7rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>WhatsApp Client Exporter</h1>
    <p>Exporte conversas de clientes em JSON</p>
  </div>

  <div class="content">
    <div class="status" id="status">
      <span class="count" id="clientCount">-</span>
      clientes encontrados
    </div>

    <button class="btn btn-primary" id="scanBtn" onclick="scan()">Escanear conversas</button>
    <button class="btn btn-secondary" id="exportBtn" onclick="exportJSON()" disabled>Exportar JSON</button>

    <div class="msg" id="msg"></div>

    <div class="preview" id="preview"></div>
  </div>

  <div class="footer">Gabriel Valadao</div>

  <script src="popup.js"></script>
</body>
</html>
